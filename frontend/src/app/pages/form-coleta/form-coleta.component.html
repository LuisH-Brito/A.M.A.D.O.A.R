<div class="form-coleta">
  <div class="container">
    <button
      type="button"
      class="btn-icone"
      (click)="voltar()"
      [disabled]="enviando"
      aria-label="Voltar para processos em andamento"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <header class="cabecalho-coleta">
      <h2 class="titulo">Coleta</h2>
    </header>

    <form
      class="formulario"
      #formColeta="ngForm"
      (ngSubmit)="abrirModalConfirmacao()"
      [attr.aria-busy]="enviando"
    >
      <div class="layout-duplo">
        <aside class="coluna-info">
          <app-dados-doador-card
            [nome]="doador.nome"
            [cpf]="doador.cpf"
            [sexo]="doador.sexo"
            [dataNascimento]="doador.dataNascimento"
          />
        </aside>

        <section class="grupo-inputs" aria-label="Dados da coleta">
          <div class="campo">
            <label for="responsavel">Responsável pela coleta</label>
            <select
              id="responsavel"
              name="responsavel"
              class="select-borda"
              #responsavel="ngModel"
              [(ngModel)]="responsavelSelecionado"
              required
              [disabled]="enviando"
            >
              <option [ngValue]="null">
                Selecionar Responsavel pela coleta
              </option>
              <option
                *ngFor="let responsavel of responsaveis"
                [ngValue]="responsavel.id"
              >
                {{ responsavel.nome_completo }}
              </option>
            </select>
            <small
              class="msg-erro"
              *ngIf="responsavel.invalid && responsavel.touched"
              >Selecione o responsável pela coleta.</small
            >
          </div>
          <fieldset class="campo-puncao" [attr.aria-describedby]="puncaoFalhou ? 'aviso-puncao-falhou' : null">
            <legend class="titulo-puncao">Punção venosa realizada com sucesso?</legend>
            <p class="descricao-puncao">Selecione o resultado registrado durante a coleta.</p>
            <div class="radios-container" role="radiogroup" aria-label="Resultado da punção venosa">
              <label class="opcao-puncao opcao-puncao--sucesso" [class.opcao-puncao--selecionada]="puncaoSucesso === 'true'">
                <input
                  type="radio"
                  name="puncao"
                  value="true"
                  [(ngModel)]="puncaoSucesso"
                  [disabled]="enviando"
                />
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                <span>
                  <strong>Sim</strong>
                  <small>Coleta realizada</small>
                </span>
              </label>
              <label class="opcao-puncao opcao-puncao--falha" [class.opcao-puncao--selecionada]="puncaoFalhou">
                <input
                  type="radio"
                  name="puncao"
                  value="false"
                  [(ngModel)]="puncaoSucesso"
                  [disabled]="enviando"
                />
                <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
                <span>
                  <strong>Não</strong>
                  <small>Coleta não realizada</small>
                </span>
              </label>
            </div>
            <p *ngIf="puncaoFalhou" id="aviso-puncao-falhou" class="aviso-puncao" role="status">
              <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
              A coleta não será realizada. Ao finalizar, o processo será cancelado e nenhuma bolsa será gerada.
            </p>
          </fieldset>
        </section>

        <div class="acoes">
        <button
          type="submit"
          class="btn-concluir btn-coleta"
          [disabled]="enviando || formColeta.invalid"
        >
          {{ enviando ? "Processando..." : "Finalizar Coleta" }}
        </button>
        </div>
      </div>
    </form>
  </div>
</div>
<app-modal-confirmacao
  [visivel]="modalVisivel"
  [titulo]="modalConfig.titulo"
  [mensagem]="modalConfig.mensagem"
  [tipo]="modalConfig.tipo"
  [textoConfirmar]="modalConfig.textoConfirmar"
  [processando]="enviando"
  (confirmado)="finalizarColeta()"
  (cancelado)="fecharModal()"
>
</app-modal-confirmacao>

<app-toast-notificacao #toast></app-toast-notificacao>
