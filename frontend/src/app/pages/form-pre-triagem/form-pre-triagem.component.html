<div class="form-pre-triagem">
  <div class="container">
    <button class="btn-icone" (click)="voltar()" [disabled]="processando">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h2 class="titulo">Pré-triagem</h2>

    <form class="formulario" #formPre="ngForm" (ngSubmit)="abrirModal('apto')">
      <div class="layout-duplo">
        <div class="grupo-inputs">
          <div class="campo">
            <label for="altura">Altura (m):</label>
            <input
              id="altura"
              type="text"
              inputmode="decimal"
              name="altura"
              #alt="ngModel"
              [(ngModel)]="form.altura"
              (blur)="formatarMedicao('altura', $event)"
              placeholder="Ex.: 1,75"
              [attr.aria-invalid]="!!alturaErro && (alt.touched || !!form.altura)"
              [attr.aria-describedby]="alturaErro && (alt.touched || form.altura) ? 'altura-erro' : null"
              required
              [disabled]="processando"
            />
            <small id="altura-erro" class="msg-erro" *ngIf="alturaErro && (alt.touched || form.altura)">{{ alturaErro }}</small>
          </div>

          <div class="campo">
            <label for="peso">Peso (kg):</label>
            <input
              id="peso"
              type="text"
              inputmode="decimal"
              name="peso"
              #ps="ngModel"
              [(ngModel)]="form.peso"
              (blur)="formatarMedicao('peso', $event)"
              placeholder="Ex.: 70,0"
              [attr.aria-invalid]="!!pesoErro && (ps.touched || !!form.peso)"
              [attr.aria-describedby]="pesoErro && (ps.touched || form.peso) ? 'peso-erro' : null"
              required
              [disabled]="processando"
            />
            <small id="peso-erro" class="msg-erro" *ngIf="pesoErro && (ps.touched || form.peso)">{{ pesoErro }}</small>
            <small
              class="msg-alerta-peso"
              *ngIf="!pesoErro && pesoInvalidoParaDoacao"
            >
              <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
              Peso abaixo do mínimo ({{ limites.pesoMinDoacaoKg }} kg) para aprovação.
            </small>
          </div>

          <div class="campo">
            <label for="hemoglobina">Teste de Hemoglobina (g/dL):</label>
            <input
              id="hemoglobina"
              type="text"
              inputmode="decimal"
              #hemo="ngModel"
              name="hemoglobina"
              [(ngModel)]="form.hemoglobina"
              (blur)="formatarMedicao('hemoglobina', $event)"
              placeholder="Ex.: 13,5"
              [attr.aria-invalid]="!!hemoglobinaErro && (hemo.touched || !!form.hemoglobina)"
              [attr.aria-describedby]="hemoglobinaErro && (hemo.touched || form.hemoglobina) ? 'hemoglobina-erro' : null"
              required
              [disabled]="processando"
            />
            <small id="hemoglobina-erro" class="msg-erro" *ngIf="hemoglobinaErro && (hemo.touched || form.hemoglobina)">{{ hemoglobinaErro }}</small>
          </div>
        </div>

        <aside class="coluna-info">
          <app-dados-doador-card
            [nome]="doador.nome"
            [cpf]="doador.cpf"
            [sexo]="doador.sexo"
            [dataNascimento]="doador.dataNascimento"
          />
        </aside>
      </div>

      <p *ngIf="orientacaoApto as orientacao" class="orientacao-apto" role="status" aria-live="polite">{{ orientacao }}</p>
      <div class="acoes">
        <button
          type="button"
          class="btn-cancelar"
          (click)="abrirModal('inapto')"
          [disabled]="processando || !medicoesValidas"
        >
          Inapto
        </button>
        <button
          type="submit"
          class="btn-concluir"
          [disabled]="processando || formPre.invalid || !podeMarcarApto"
        >
          Apto
        </button>
      </div>
    </form>
  </div>
</div>

<app-modal-confirmacao
  [visivel]="modalVisivel"
  [titulo]="modalConfig.titulo"
  [mensagem]="modalConfig.mensagem"
  [tipo]="modalConfig.tipo"
  [textoConfirmar]="modalConfig.textoConfirmar"
  [processando]="processando"
  (confirmado)="confirmarAcaoModal()"
  (cancelado)="fecharModal()"
>
</app-modal-confirmacao>

<app-toast-notificacao #toast></app-toast-notificacao>
