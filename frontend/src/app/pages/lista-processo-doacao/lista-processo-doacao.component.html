<div class="pagina">
    <div class="centralizando">
         
         <div class="header-com-acoes">
            <div class="titulo-com-voltar">
                <button class="btn-icone" (click)="voltar()" title="Voltar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <h2 class="titulo">Processos em Andamento</h2>
            </div>
         </div>
         
        <nav class="navegacao-abas" role="tablist" aria-label="Etapas de Doação">
            <button 
                role="tab"
                [attr.aria-selected]="abaAtiva === 'pre-triagem'"
                [class.ativo]="abaAtiva === 'pre-triagem'" 
                (click)="selecionarAba('pre-triagem')">
                <span class="etapa-label">
                    Pré-Triagem
                    <span class="etapa-count">{{ preTriagem.length }}</span>
                </span>
            </button>
            <button 
                role="tab"
                [attr.aria-selected]="abaAtiva === 'triagem'"
                [class.ativo]="abaAtiva === 'triagem'" 
                (click)="selecionarAba('triagem')">
                <span class="etapa-label">
                    Triagem
                    <span class="etapa-count">{{ triagem.length }}</span>
                </span>
            </button>
            <button 
                role="tab"
                [attr.aria-selected]="abaAtiva === 'coleta'"
                [class.ativo]="abaAtiva === 'coleta'" 
                (click)="selecionarAba('coleta')">
                <span class="etapa-label">
                    Coleta
                    <span class="etapa-count">{{ coleta.length }}</span>
                </span>
            </button>
        </nav>

        <div class="lista-container">
            <div class="lista-scroll">

                <ng-container *ngIf="abaAtiva === 'pre-triagem'">
                    <div *ngFor="let p of preTriagem" class="usuario-card">
                        <div class="info">Nome: {{ p.doador?.nome_completo || p.doador?.username }}</div>
                        <div class="acoes" *ngIf="!isRecepcionista">
                                                    <button class="btn-acao" [disabled]="p.em_andamento || p.id === processoIdProcessando" (click)="abrirPreTriagem(p.id)">
                                                        {{ p.em_andamento ? 'Em andamento' : (p.id === processoIdProcessando ? 'Abrindo...' : 'Realizar Pré-triagem') }}
                          </button>
                        </div>
                        <div class="acoes" *ngIf="isRecepcionista">
                          <span></span>
                        </div>
                    </div>
                    <div *ngIf="preTriagem.length === 0">Nenhum processo em pré-triagem.</div>
                </ng-container>

                <ng-container *ngIf="abaAtiva === 'triagem'">
                    <div *ngFor="let p of triagem" class="usuario-card">
                        <div class="info">Nome: {{ p.doador?.nome_completo || p.doador?.username }}</div>

                        <div class="acoes" *ngIf="podeTriagem">
                                                    <button class="btn-acao" [disabled]="p.em_andamento || p.id === processoIdProcessando" (click)="abrirTriagem(p.id)">
                                                        {{ p.em_andamento ? 'Em andamento' : (p.id === processoIdProcessando ? 'Abrindo...' : 'Realizar Triagem') }}
                          </button>
                        </div>

                        <div class="acoes" *ngIf="!podeTriagem">
                          <span></span>
                        </div>
                    </div>
                    <div *ngIf="triagem.length === 0">Nenhum processo em triagem.</div>
                </ng-container>

                <ng-container *ngIf="abaAtiva === 'coleta'">
                    <div *ngFor="let p of coleta" class="usuario-card">
                        <div class="info">Nome: {{ p.doador?.nome_completo || p.doador?.username }}</div>
                        <div class="acoes" *ngIf="podeColeta">
                                                        <button class="btn-acao" [disabled]="p.em_andamento || p.id === processoIdProcessando" (click)="abrirColeta(p.id)">
                                                            {{ p.em_andamento ? 'Em andamento' : (p.id === processoIdProcessando ? 'Abrindo...' : 'Realizar Coleta') }}
                            </button>
                        </div>
                        <div class="acoes" *ngIf="!podeColeta">
                            <span></span>
                        </div>
                    </div>
                    <div *ngIf="coleta.length === 0">Nenhum processo em coleta.</div>
                </ng-container>

            </div>
        </div>
        
    </div>
</div>
